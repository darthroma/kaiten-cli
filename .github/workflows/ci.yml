name: Package checks and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync pytest -o addopts= -q
      - run: uv run --no-sync kaiten --help

  release:
    name: Build and publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.11'
      - name: Verify version matches the tag
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as stream:
              version = tomllib.load(stream)['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match project.version'
          PY
      - run: uv build
      - name: Publish built packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
